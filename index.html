<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formé — Designed for daily life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    /* ── TOKENS ── */
    :root {
      --color-accent:      #2D2D2D;
      --color-bg:          #FFFFFF;
      --color-bg-alt:      #FAFAFA;
      --color-bg-soft:     #F5F5F5;
      --color-text:        #1A1A1A;
      --color-muted:       #888888;
      --color-soft:        #444444;
      --color-border:      #EEEEEE;
      --color-placeholder: #E0E0E0;
      --color-footer-bg:   #1A1A1A;

      --font-base: 'Inter', system-ui, -apple-system, sans-serif;
      --container-max: 1200px;
      --container-pad: 24px;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-base);
      font-size: 13px;
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* ── FOCUS ── */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* ── LAYOUT CONTAINER ── */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-pad);
    }

    /* ── SHARED SECTION HEADING ── */
    .section-heading { font-size: 28px; font-weight: 700; }
    .section-subtext  { font-size: 13px; color: var(--color-muted); margin-top: 6px; }

    /* ── NAVIGATION ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    .nav__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }
    .nav__logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--color-text);
    }
    .nav__links {
      display: flex;
      gap: 32px;
    }
    .nav__links a {
      font-size: 13px;
      font-weight: 400;
      color: var(--color-text);
      position: relative;
      padding-bottom: 2px;
    }
    .nav__links a:hover::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--color-accent);
    }
    .nav__icons {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav__icon-btn {
      display: flex;
      align-items: center;
      color: var(--color-text);
      cursor: pointer;
    }
    .nav__icon-btn:hover { opacity: 0.6; }

  </style>
</head>
<body>

  <!-- ── NAVIGATION ── -->
  <header class="nav">
    <div class="container nav__inner">
      <a href="#" class="nav__logo">FORMÉ</a>
      <nav class="nav__links" aria-label="Main navigation">
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
      </nav>
      <div class="nav__icons">
        <button class="nav__icon-btn nav__search" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="nav__icon-btn nav__cart" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- sections will go here -->

  <script>
    // JS will go here
  </script>
</body>
</html>
